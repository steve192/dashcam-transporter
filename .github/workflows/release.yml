name: Release

on:
  workflow_dispatch:
    inputs:
      skip_default_branch_ci_check:
        description: "Skip verifying that the release commit already has a successful CI run"
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip_default_branch_ci_check:
        description: "Skip verifying that the release commit already has a successful CI run"
        type: boolean
        default: false

# Two releases at once would race to push the same tag and the same version commit.
# Queue them instead of cancelling: a cancelled release can leave a tag without packages.
concurrency:
  group: release
  cancel-in-progress: false

# Only what every job needs. The jobs that write (tag, publish) raise their own
# ceiling, so a compromised step in one job cannot use another job's privileges.
permissions:
  contents: read

jobs:
  semantic-preview:
    name: Semantic release preview
    runs-on: ubuntu-latest
    permissions:
      # Write, despite this being a dry run: semantic-release verifies up front that it could
      # push, with `git push --dry-run`, and a read-only token fails that with a 403 rather
      # than reporting the version it would have released.
      contents: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Release tooling only: semantic-release needs a current Node.js, and the
      # application's Node.js (.nvmrc) is far too old for it.
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      - name: Run semantic-release dry run
        id: semantic
        uses: cycjimmy/semantic-release-action@v8.1.4
        with:
          dry_run: true
          semantic_version: 25.0.9
          branches: main
          extra_plugins: |
            @semantic-release/exec@7
            @semantic-release/git@11
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-default-branch-ci:
    name: Verify default branch CI
    needs: semantic-preview
    # The job runs whenever there is something to publish. The actual
    # verification steps are gated by ``skip_default_branch_ci_check`` so that
    # downstream jobs (which `needs:` this one) see a ``success`` result instead
    # of a ``skipped`` result when verification is bypassed - GitHub
    # cascade-skips dependents of a skipped job by default, so skipping the job
    # itself would silently skip the entire release.
    if: needs.semantic-preview.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Reads the CI run that covers the release commit; see the last step.
      actions: read
      contents: read
    steps:
      - name: Skip verification (called from CI itself)
        if: inputs.skip_default_branch_ci_check
        # The CI workflow calls this reusable workflow as one of its jobs, so
        # when this flag is set the calling workflow IS the CI run we would
        # otherwise have to wait for. Querying the API here would never find a
        # completed successful run for $GITHUB_SHA, because the run that called
        # us is still in_progress.
        run: |
          echo "Bypassed: the calling workflow is the CI run for $GITHUB_SHA."

      - name: Confirm release commit matches default branch head
        if: ${{ !inputs.skip_default_branch_ci_check }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          DEFAULT_BRANCH_SHA=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" | jq -r '.commit.sha')

          echo "Release workflow SHA: $GITHUB_SHA"
          echo "Default branch SHA:  $DEFAULT_BRANCH_SHA"

          if [ "$GITHUB_SHA" != "$DEFAULT_BRANCH_SHA" ]; then
            echo "Release workflow is not running on the current default branch head"
            exit 1
          fi

      - name: Confirm CI succeeded for release commit
        if: ${{ !inputs.skip_default_branch_ci_check }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # ``head_sha`` filters server-side to runs for this exact commit;
          # ``status=success`` filters to runs whose CONCLUSION is success (the
          # endpoint's ``status`` parameter accepts either status or conclusion
          # values, but does NOT accept a ``conclusion`` key - unknown query
          # params are silently dropped, which would let a failed completed run
          # sneak through if we used ``status=completed`` alone).
          SUCCESSFUL_RUN_ID=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$DEFAULT_BRANCH&head_sha=$GITHUB_SHA&status=success&per_page=5" \
            | jq -r '.workflow_runs[0].id // empty')

          if [ -z "$SUCCESSFUL_RUN_ID" ]; then
            echo "No successful CI workflow run found for commit $GITHUB_SHA on $DEFAULT_BRANCH"
            exit 1
          fi

          echo "Found successful CI workflow run: $SUCCESSFUL_RUN_ID"

  tag:
    name: Create tag and draft GitHub release
    needs: [semantic-preview, verify-default-branch-ci]
    if: needs.semantic-preview.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # @semantic-release/github comments on the released PRs/issues, which
      # needs pull-requests + issues write. A job-level permissions block sets
      # every unlisted scope to none, so these must be listed explicitly.
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # semantic-release's prepareCmd writes the release version into
      # backend/package.json with `npm version`, and @semantic-release/git commits it.
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      # The GitHub release is created as a draft (see .releaserc.json): install.sh and
      # `dashcam-transporter update` download the .deb from the latest release, so it
      # only becomes the latest release once the publish job has attached the packages.
      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@v8.1.4
        with:
          semantic_version: 25.0.9
          branches: main
          extra_plugins: |
            @semantic-release/exec@7
            @semantic-release/git@11
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build .deb (${{ matrix.arch }})
    needs: [semantic-preview, tag]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64, armhf]
    steps:
      # The tag points at the release commit, so the package carries the released version.
      - name: Checkout tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.semantic-preview.outputs.tag }}

      - name: Set up QEMU
        if: matrix.arch == 'arm64' || matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v4.4.0

      - name: Build .deb
        run: packaging/build-deb-in-docker.sh ${{ matrix.arch }}

      - name: Upload .deb
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  test-install:
    name: Install on ${{ matrix.debian }} (${{ matrix.arch }})
    needs: [semantic-preview, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64, armhf]
        # Raspberry Pi OS Bookworm and Trixie are based on these, and bring their nodejs.
        debian: [bookworm, trixie]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.semantic-preview.outputs.tag }}

      - name: Download .deb
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-deb-${{ matrix.arch }}
          path: dist

      - name: Set up QEMU
        if: matrix.arch == 'arm64' || matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v4.4.0

      - name: Install and smoke test
        run: packaging/test-install-in-docker.sh ${{ matrix.arch }} ${{ matrix.debian }}

  publish:
    name: Publish GitHub release
    needs: [semantic-preview, build, test-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-deb-*
          path: dist
          merge-multiple: true

      - name: Attach packages and publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.semantic-preview.outputs.tag }}
        run: |
          ls -la dist
          gh release upload "$TAG" dist/*.deb --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
